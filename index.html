// ============================================================
// Respaldo local anti-pérdida-de-datos (localStorage)
// ============================================================
const QUEUE_KEY = "finanzas_pending_ops_v1";
const CACHE_KEY = "finanzas_cache_v1";
const offline = {
  getQueue() { try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]"); } catch { return []; } },
  saveQueue(q) { try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch {} },
  pushOp(op) { const q = offline.getQueue(); q.push({ ...op, id: newId(), ts: Date.now() }); offline.saveQueue(q); return q; },
  removeOp(id) { const q = offline.getQueue().filter(o => o.id !== id); offline.saveQueue(q); return q; },
  saveCache(userId, data) { try { localStorage.setItem(`${CACHE_KEY}_${userId}`, JSON.stringify({ ...data, savedAt: Date.now() })); } catch {} },
  loadCache(userId) { try { return JSON.parse(localStorage.getItem(`${CACHE_KEY}_${userId}`) || "null"); } catch { return null; } },
};

  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 10, height: 140, padding: "0 4px" }}>

// ============================================================
// Campo de dinero con separador de miles mientras se escribe
// ============================================================
function MoneyInput({ value, onChange, placeholder, style }) {
  const display = value === "" || value === null || value === undefined
    ? ""
    : Number(value).toLocaleString("es-CO");
  const handle = (e) => {
    const raw = e.target.value.replace(/[^\d]/g, "");
    onChange(raw === "" ? "" : raw.replace(/^0+(?=\d)/, ""));
  };
  return <input inputMode="numeric" value={display} onChange={handle} style={style} placeholder={placeholder || "Ej: 150.000"} />;
}

// ============================================================
// RAÍZ — control de sesión (login → PIN → app)
// ============================================================
function App() {
  const [session, setSession] = useState(undefined);
  const [pinOk, setPinOk] = useState(false);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (session === undefined) return <div style={{ minHeight: "100vh", background: C.bg }} />;
  if (!session) return <LoginScreen />;
  if (!pinOk) return <PinLock onUnlock={() => setPinOk(true)} />;
  return <FinanzasApp session={session} onLogout={() => { setPinOk(false); sb.auth.signOut(); }} />;
}

function LoginScreen() {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [msg, setMsg] = useState("");

  const submit = async (e) => {
    e.preventDefault();
    setError(""); setMsg(""); setLoading(true);
    try {
      if (mode === "login") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        setMsg("Cuenta creada. Si tu proyecto pide confirmación por correo, revisa tu email antes de iniciar sesión.");
      }
    } catch (err) {
      setError(err.message === "Invalid login credentials" ? "Correo o contraseña incorrectos." : err.message);
    } finally { setLoading(false); }
  };

  const inputSt = { width: "100%", background: C.bg, border: "none", borderRadius: 12, padding: "12px 14px", fontSize: 14, boxSizing: "border-box" };

  return (
    <div style={{ minHeight: "100vh", background: GRADIENT, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <form onSubmit={submit} style={{ background: "#fff", borderRadius: 22, padding: 28, width: "100%", maxWidth: 380 }}>
        <div style={{ width: 52, height: 52, borderRadius: 16, background: GRADIENT, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 14, fontSize: 24 }}>💰</div>
        <div className="mn" style={{ fontWeight: 800, fontSize: 20, marginBottom: 4 }}>{mode === "login" ? "Inicia sesión" : "Crea tu cuenta"}</div>
        <div style={{ color: C.muted, fontSize: 13, marginBottom: 20 }}>Mis Finanzas</div>
        <label style={{ fontSize: 11.5, fontWeight: 700, color: C.muted, display: "block", marginBottom: 4 }}>Correo</label>
        <input required type="email" value={email} onChange={(e) => setEmail(e.target.value)} style={inputSt} placeholder="tu@correo.com" />
        <label style={{ fontSize: 11.5, fontWeight: 700, color: C.muted, display: "block", margin: "12px 0 4px" }}>Contraseña</label>
        <input required type="password" minLength={6} value={password} onChange={(e) => setPassword(e.target.value)} style={inputSt} placeholder="Mínimo 6 caracteres" />
        {error && <div style={{ color: C.danger, fontSize: 12.5, marginTop: 12 }}>{error}</div>}
        {msg && <div style={{ color: C.success, fontSize: 12.5, marginTop: 12 }}>{msg}</div>}
        <button type="submit" disabled={loading} style={{ width: "100%", marginTop: 18, background: GRADIENT, color: "#fff", border: "none", borderRadius: 12, padding: "13px 0", fontWeight: 700, fontSize: 14 }}>
          {loading ? "Un momento..." : mode === "login" ? "Entrar" : "Registrarme"}
        </button>
        <button type="button" onClick={() => { setMode(mode === "login" ? "signup" : "login"); setError(""); setMsg(""); }} style={{ width: "100%", marginTop: 10, background: "none", border: "none", color: C.indigo, fontSize: 12.5, fontWeight: 600, padding: 8 }}>
          {mode === "login" ? "¿No tienes cuenta? Regístrate" : "Ya tengo cuenta, iniciar sesión"}
        </button>
      </form>
    </div>
  );
}

function PinLock({ onUnlock }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);
  const [shake, setShake] = useState(false);

  useEffect(() => {
    if (pin.length === 4) {
      if (pin === PIN_CODE) setTimeout(onUnlock, 200);
      else { setShake(true); setError(true); setTimeout(() => { setPin(""); setShake(false); }, 500); }
    }
  }, [pin]);

  const press = (d) => { if (pin.length < 4) { setError(false); setPin(p => p + d); } };
  const del = () => setPin(p => p.slice(0, -1));

  useEffect(() => {
    const onKey = (e) => {
      if (e.key >= "0" && e.key <= "9") press(e.key);
      else if (e.key === "Backspace") del();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [pin]);

  const keys = [1,2,3,4,5,6,7,8,9,"",0,"del"];
  const keyStyle = { width: 68, height: 68, borderRadius: 99, background: "rgba(255,255,255,0.10)", border: "1px solid rgba(255,255,255,0.14)", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" };

  return (
    <div style={{ minHeight: "100vh", background: GRADIENT, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ width: 64, height: 64, borderRadius: 20, background: "rgba(255,255,255,0.15)", display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 18, fontSize: 28 }}>💰</div>
      <div style={{ color: "#fff", fontWeight: 700, fontSize: 18, marginBottom: 4 }}>Mis Finanzas</div>
      <div style={{ color: "rgba(255,255,255,0.75)", fontSize: 13, marginBottom: 32 }}>Ingresa tu PIN para continuar (también puedes usar el teclado)</div>
      <div className={shake ? "shake" : ""} style={{ display: "flex", gap: 16, marginBottom: error ? 12 : 36 }}>
        {[0,1,2,3].map(i => <div key={i} style={{ width: 16, height: 16, borderRadius: 99, background: i < pin.length ? "#fff" : "rgba(255,255,255,0.28)" }} />)}
      </div>
      {error && <div style={{ color: "#FFD3D3", fontSize: 12.5, marginBottom: 24 }}>PIN incorrecto, intenta de nuevo</div>}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 68px)", gap: 14 }}>
        {keys.map((k, i) => {
          if (k === "") return <div key={i} />;
          if (k === "del") return <button key={i} onClick={del} className="keybtn" style={keyStyle}>⌫</button>;
          return <button key={i} onClick={() => press(String(k))} className="keybtn" style={{ ...keyStyle, fontSize: 22, fontWeight: 600, color: "#fff" }}>{k}</button>;
        })}
      </div>
    </div>
  );
}

// ============================================================
// APP PRINCIPAL
// ============================================================
function FinanzasApp({ session, onLogout }) {
  const userId = session.user.id;
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");
  const [usingCache, setUsingCache] = useState(false);
  const [pendingCount, setPendingCount] = useState(offline.getQueue().length);
  const [syncing, setSyncing] = useState(false);
  const [movimientos, setMovimientos] = useState([]);
  const [gastosFijos, setGastosFijos] = useState([]);
  const [deudas, setDeudas] = useState([]);
  const [view, setView] = useState("inicio");
  const [showModal, setShowModal] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [showDeudaModal, setShowDeudaModal] = useState(false);
  const [editingDeudaId, setEditingDeudaId] = useState(null);
  const [search, setSearch] = useState("");
  const [filterTipo, setFilterTipo] = useState("Todos");
  const [filterCat, setFilterCat] = useState("Todas");
  const [filterMes, setFilterMes] = useState("Todos");
  const [calMode, setCalMode] = useState("calendario");
  const [calOffset, setCalOffset] = useState(0);
  const [selectedFijo, setSelectedFijo] = useState(null);
  const [selectedDay, setSelectedDay] = useState(null);
  const [metas, setMetas] = useState([]);
  const [presupuestos, setPresupuestos] = useState([]);
  const [filtroAmbito, setFiltroAmbito] = useState("Todos");
  const [showNotifs, setShowNotifs] = useState(false);
  const [showNewMeta, setShowNewMeta] = useState(false);
  const [metaForm, setMetaForm] = useState({ nombre: "", objetivo: "", actual: "", fechaLimite: "", ambito: "Personal" });

  const today = new Date();
  const mesActual = `${today.getFullYear()}-${pad(today.getMonth() + 1)}`;
  const emptyForm = { tipo: "gasto", monto: "", fecha: today.toISOString().slice(0, 10), categoria: CATEGORIAS_GASTO[0], cuenta: CUENTAS[0], descripcion: "", fijoVariable: "variable", ambito: "Personal", reembolsable: false };
  const [form, setForm] = useState(emptyForm);
  const emptyDeudaForm = { entidad: "", tipo: "Préstamo", valorTotal: "", valorCuota: "", diaPago: "1", cuotasTotales: "", cuotasPagadas: "0", fechaInicio: today.toISOString().slice(0, 10), tasaInteres: "", notas: "", ambito: "Personal" };
  const [deudaForm, setDeudaForm] = useState(emptyDeudaForm);

  const reload = useCallback(async () => {
    try {
      setLoadError("");
      const [mov, fijos, deu] = await Promise.all([db.fetchMovimientos(userId), db.fetchGastosFijos(userId), db.fetchDeudas(userId)]);
      setMovimientos(mov); setGastosFijos(fijos); setDeudas(deu);
      // Metas y presupuestos: si aún no corriste la migración, no rompe la app.
      let met = [], pres = [];
      try { met = await db.fetchMetas(userId); } catch (e) { met = []; }
      try { pres = await db.fetchPresupuestos(userId); } catch (e) { pres = []; }
      setMetas(met); setPresupuestos(pres);
      setUsingCache(false);
      offline.saveCache(userId, { movimientos: mov, gastosFijos: fijos, deudas: deu, metas: met, presupuestos: pres });
    } catch (e) {
      const cached = offline.loadCache(userId);
      if (cached) { setMovimientos(cached.movimientos || []); setGastosFijos(cached.gastosFijos || []); setDeudas(cached.deudas || []); setMetas(cached.metas || []); setPresupuestos(cached.presupuestos || []); setUsingCache(true); setLoadError(""); }
      else setLoadError(e.message || "Error cargando datos de Supabase.");
    } finally { setLoading(false); }
  }, [userId]);

  useEffect(() => { reload(); }, [reload]);

  const retrySync = useCallback(async () => {
    const queue = offline.getQueue();
    if (queue.length === 0) return;
    setSyncing(true);
    for (const op of queue) {
      try {
        if (op.type === "upsert") {
          if (op.table === "movimientos") await db.insertMovimiento(userId, op.payload);
          else if (op.table === "gastos_fijos") await db.insertGastoFijo(userId, op.payload);
          else if (op.table === "deudas") await db.insertDeuda(userId, op.payload);
          else if (op.table === "metas") await db.insertMeta(userId, op.payload);
          else if (op.table === "presupuestos") await db.upsertPresupuesto(userId, op.payload);
        } else if (op.type === "update") {
          if (op.table === "movimientos") await db.updateMovimiento(op.rowId, op.payload);
          else if (op.table === "gastos_fijos") await db.updateGastoFijo(op.rowId, op.payload);
          else if (op.table === "deudas") await db.updateDeuda(op.rowId, op.payload);
          else if (op.table === "metas") await db.updateMeta(op.rowId, op.payload);
        } else if (op.type === "delete") {
          if (op.table === "movimientos") await db.deleteMovimiento(op.rowId);
          else if (op.table === "gastos_fijos") await db.deleteGastoFijo(op.rowId);
          else if (op.table === "deudas") await db.deleteDeuda(op.rowId);
          else if (op.table === "metas") await db.deleteMeta(op.rowId);
          else if (op.table === "presupuestos") await db.deletePresupuesto(op.rowId);
        }
        offline.removeOp(op.id);
      } catch (err) { break; }
    }
    setPendingCount(offline.getQueue().length);
    setSyncing(false);
    reload();
  }, [userId, reload]);

  useEffect(() => {
    retrySync();
    const onOnline = () => retrySync();
    window.addEventListener("online", onOnline);
    const interval = setInterval(() => { if (offline.getQueue().length > 0) retrySync(); }, 20000);
    return () => { window.removeEventListener("online", onOnline); clearInterval(interval); };
  }, [retrySync]);

  useEffect(() => {
    const ch = sb.channel("finanzas-sync")
      .on("postgres_changes", { event: "*", schema: "public", table: "movimientos", filter: `user_id=eq.${userId}` }, reload)
      .on("postgres_changes", { event: "*", schema: "public", table: "gastos_fijos", filter: `user_id=eq.${userId}` }, reload)
      .on("postgres_changes", { event: "*", schema: "public", table: "deudas", filter: `user_id=eq.${userId}` }, reload)
      .on("postgres_changes", { event: "*", schema: "public", table: "metas", filter: `user_id=eq.${userId}` }, reload)
      .on("postgres_changes", { event: "*", schema: "public", table: "presupuestos", filter: `user_id=eq.${userId}` }, reload)
      .subscribe();
    return () => sb.removeChannel(ch);
  }, [userId, reload]);

  // ---- Filtro transversal por ámbito (Personal / PubliFuturo / Todos) ----
  function enAmbito(x) { return filtroAmbito === "Todos" || (x.ambito || "Personal") === filtroAmbito; }
  const movsAmbito = useMemo(() => movimientos.filter(enAmbito), [movimientos, filtroAmbito]);
  const fijosAmbito = useMemo(() => gastosFijos.filter(enAmbito), [gastosFijos, filtroAmbito]);
  const deudasAmbito = useMemo(() => deudas.filter(enAmbito), [deudas, filtroAmbito]);
  const metasAmbito = useMemo(() => metas.filter(enAmbito), [metas, filtroAmbito]);

  const saldoActual = useMemo(() => movsAmbito.reduce((acc, m) => acc + (m.tipo === "ingreso" ? m.monto : (m.tipo === "gasto" || m.tipo === "pago_deuda") ? -m.monto : 0), 0), [movsAmbito]);
  const movMes = movsAmbito.filter(m => m.fecha.slice(0, 7) === mesActual);
  const ingresosMes = movMes.filter(m => m.tipo === "ingreso").reduce((a, m) => a + m.monto, 0);
  const gastosVariablesMes = movMes.filter(m => m.tipo === "gasto" && m.fijoVariable === "variable").reduce((a, m) => a + m.monto, 0);
  const totalGastosFijos = fijosAmbito.reduce((a, f) => a + ((f.frecuencia === "Único" && f.pagadoMes) ? 0 : f.monto), 0);
  const gastosMes = totalGastosFijos + gastosVariablesMes;
  const disponible = ingresosMes - gastosMes;
  const totalReembolsable = movMes.filter(m => m.tipo === "gasto" && m.reembolsable).reduce((a, m) => a + m.monto, 0);

  const proximoPago = useMemo(() => {
    const pend = fijosAmbito.filter(f => f.pagadoMes !== mesActual).sort((a, b) => a.diaPago - b.diaPago);
    return pend[0] || null;
  }, [fijosAmbito, mesActual]);

  function estadoFijo(f) {
    if (f.frecuencia === "Único") return f.pagadoMes ? "Pagado" : (f.diaPago < today.getDate() ? "Vencido" : "Próximo");
    return f.pagadoMes === mesActual ? "Pagado" : f.diaPago < today.getDate() ? "Vencido" : "Próximo";
  }
  const estadoColor = { Pagado: C.success, Vencido: C.danger, "Próximo": C.warning };
  const estadoSoft = { Pagado: C.successSoft, Vencido: C.dangerSoft, "Próximo": C.warningSoft };

  function estadoDeuda(d) {
    if (d.cuotasPagadas >= d.cuotasTotales) return "Pagada";
    const [y0, m0] = d.fechaInicio.slice(0, 7).split("-").map(Number);
    const mesesTranscurridos = (today.getFullYear() - y0) * 12 + (today.getMonth() - (m0 - 1)) + (today.getDate() >= d.diaPago ? 1 : 0);
    return d.cuotasPagadas < Math.min(mesesTranscurridos, d.cuotasTotales) ? "Atrasada" : "Al día";
  }
  function saldoPendienteDeuda(d) { return Math.max(0, (d.cuotasTotales - d.cuotasPagadas) * d.valorCuota); }

  // ---- Presupuestos por categoría (gasto real vs. límite) ----
  const presupuestoEstado = useMemo(() => {
    const gastoPorCat = {};
    movMes.filter(m => m.tipo === "gasto").forEach(m => { gastoPorCat[m.categoria] = (gastoPorCat[m.categoria] || 0) + m.monto; });
    fijosAmbito.forEach(f => { gastoPorCat[f.categoria] = (gastoPorCat[f.categoria] || 0) + f.monto; });
    return presupuestos.map(p => {
      const gastado = gastoPorCat[p.categoria] || 0;
      const pct = Math.round((gastado / p.limite) * 100);
      return { ...p, gastado, pct, excedido: gastado > p.limite };
    }).sort((a, b) => b.pct - a.pct);
  }, [presupuestos, movsAmbito, fijosAmbito, mesActual]);

  // ---- Notificaciones: pagos próximos, deudas y presupuestos excedidos ----
  const notificaciones = useMemo(() => {
    const out = [];
    const diaHoy = today.getDate();
    fijosAmbito.forEach(f => {
      const est = estadoFijo(f);
      if (est === "Vencido") out.push({ id: "n-f-" + f.id, tipo: "vencido", texto: `${f.nombre} está vencido (día ${f.diaPago})`, monto: f.monto });
      else if (est === "Próximo" && f.diaPago - diaHoy <= 5) out.push({ id: "n-f-" + f.id, tipo: "proximo", texto: `${f.nombre} vence en ${f.diaPago - diaHoy} día(s)`, monto: f.monto });
    });
    deudasAmbito.forEach(d => {
      const est = estadoDeuda(d);
      if (est === "Atrasada") out.push({ id: "n-d-" + d.id, tipo: "vencido", texto: `Cuota atrasada — ${d.entidad}`, monto: d.valorCuota });
      else if (est === "Al día" && d.diaPago - diaHoy <= 5 && d.diaPago >= diaHoy) out.push({ id: "n-d-" + d.id, tipo: "proximo", texto: `Cuota de ${d.entidad} en ${d.diaPago - diaHoy} día(s)`, monto: d.valorCuota });
    });
    presupuestoEstado.filter(p => p.excedido).forEach(p => {
      out.push({ id: "n-p-" + p.id, tipo: "presupuesto", texto: `Excediste el presupuesto de ${p.categoria} (${p.pct}%)`, monto: p.gastado });
    });
    return out;
  }, [fijosAmbito, deudasAmbito, presupuestoEstado]);

  const totalDeudaPendiente = useMemo(() => deudasAmbito.reduce((a, d) => a + saldoPendienteDeuda(d), 0), [deudasAmbito]);
  const patrimonioNeto = saldoActual - totalDeudaPendiente;

  const dataMensual = useMemo(() => {
    const map = {};
    movsAmbito.forEach(m => {
      if (m.tipo === "transferencia") return;
      const key = m.fecha.slice(0, 7);
      if (!map[key]) map[key] = { key, ingreso: 0, gasto: 0 };
      map[key][m.tipo === "ingreso" ? "ingreso" : "gasto"] += m.monto;
    });
    return Object.values(map).sort((a, b) => a.key.localeCompare(b.key)).slice(-6).map(d => ({ ...d, label: MESES[parseInt(d.key.slice(5, 7), 10) - 1].slice(0, 3) }));
  }, [movimientos]);

  const categoriasMes = useMemo(() => {
    const map = {};
    movMes.filter(m => m.tipo === "gasto").forEach(m => { map[m.categoria] = (map[m.categoria] || 0) + m.monto; });
    fijosAmbito.forEach(f => { map[f.categoria] = (map[f.categoria] || 0) + f.monto; });
    const total = Object.values(map).reduce((a, b) => a + b, 0) || 1;
    return Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([name, value]) => ({ name, value, pct: Math.round((value / total) * 100) }));
  }, [movMes, gastosFijos]);

  const mesAnteriorGasto = useMemo(() => {
    const d = new Date(today.getFullYear(), today.getMonth() - 1, 1);
    const key = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    return movsAmbito.filter(m => m.tipo === "gasto" && m.fecha.slice(0, 7) === key).reduce((a, m) => a + m.monto, 0) + totalGastosFijos;
  }, [movimientos, totalGastosFijos]);
  const variacionPct = mesAnteriorGasto > 0 ? Math.round(((gastosMes - mesAnteriorGasto) / mesAnteriorGasto) * 100) : 0;

  const saldoProyectado = useMemo(() => {
    const pend = fijosAmbito.filter(f => f.pagadoMes !== mesActual).reduce((a, f) => a + f.monto, 0);
    return saldoActual - pend;
  }, [saldoActual, gastosFijos, mesActual]);

  const filtered = useMemo(() => movsAmbito
    .filter(m => filterTipo === "Todos" || m.tipo === filterTipo)
    .filter(m => filterCat === "Todas" || m.categoria === filterCat)
    .filter(m => filterMes === "Todos" || m.fecha.slice(0, 7) === filterMes)
    .filter(m => !search || (m.descripcion + m.categoria + m.cuenta).toLowerCase().includes(search.toLowerCase()))
    .sort((a, b) => b.fecha.localeCompare(a.fecha)), [movsAmbito, filterTipo, filterCat, filterMes, search]);

  const mesesDisponibles = useMemo(() => Array.from(new Set(movsAmbito.map(m => m.fecha.slice(0, 7)))).sort().reverse(), [movsAmbito]);
  const recientes = useMemo(() => movsAmbito.slice(0, 5), [movsAmbito]);

  const openNew = (tipo) => { setEditingId(null); setForm({ ...emptyForm, tipo: tipo || "gasto", categoria: tipo === "ingreso" ? CATEGORIAS_INGRESO[0] : CATEGORIAS_GASTO[0], ambito: filtroAmbito === "Todos" ? "Personal" : filtroAmbito }); setShowModal(true); };
  const openEdit = (m) => { setEditingId(m.id); setForm({ ...m, monto: String(m.monto) }); setShowModal(true); };

  const submitForm = async (e) => {
    e.preventDefault();
    const monto = parseFloat(form.monto);
    if (!monto || monto <= 0) return;
    const payload = { ...form, monto };
    setShowModal(false);
    if (editingId) {
      setMovimientos(p => p.map(m => (m.id === editingId ? { ...payload, id: editingId } : m)));
      try { await db.updateMovimiento(editingId, payload); }
      catch (err) { offline.pushOp({ type: "update", table: "movimientos", rowId: editingId, payload }); setPendingCount(offline.getQueue().length); }
    } else {
      const id = newId();
      setMovimientos(p => [{ ...payload, id }, ...p]);
      try { await db.insertMovimiento(userId, { ...payload, id }); }
      catch (err) { offline.pushOp({ type: "upsert", table: "movimientos", payload: { ...payload, id } }); setPendingCount(offline.getQueue().length); }
    }
  };
  const deleteMov = async (id) => {
    setMovimientos(p => p.filter(m => m.id !== id));
    try { await db.deleteMovimiento(id); }
    catch (err) { offline.pushOp({ type: "delete", table: "movimientos", rowId: id }); setPendingCount(offline.getQueue().length); }
  };

  const marcarPagado = async (id) => {
    setGastosFijos(p => p.map(f => (f.id === id ? { ...f, pagadoMes: mesActual } : f)));
    try { await db.updateGastoFijo(id, { pagadoMes: mesActual }); }
    catch (err) { offline.pushOp({ type: "update", table: "gastos_fijos", rowId: id, payload: { pagadoMes: mesActual } }); setPendingCount(offline.getQueue().length); }
  };
  const desmarcarPagado = async (id) => {
    setGastosFijos(p => p.map(f => (f.id === id ? { ...f, pagadoMes: null } : f)));
    try { await db.updateGastoFijo(id, { pagadoMes: null }); }
    catch (err) { offline.pushOp({ type: "update", table: "gastos_fijos", rowId: id, payload: { pagadoMes: null } }); setPendingCount(offline.getQueue().length); }
  };
  const editarFijo = async (id, patch) => {
    setGastosFijos(p => p.map(f => (f.id === id ? { ...f, ...patch } : f)));
    try { await db.updateGastoFijo(id, patch); }
    catch (err) { offline.pushOp({ type: "update", table: "gastos_fijos", rowId: id, payload: patch }); setPendingCount(offline.getQueue().length); }
  };
  const eliminarFijo = async (id) => {
    setGastosFijos(p => p.filter(f => f.id !== id));
    try { await db.deleteGastoFijo(id); }
    catch (err) { offline.pushOp({ type: "delete", table: "gastos_fijos", rowId: id }); setPendingCount(offline.getQueue().length); }
  };
  const [showNewFijo, setShowNewFijo] = useState(false);
  const [fijoForm, setFijoForm] = useState({ nombre: "", monto: "", diaPago: "1", categoria: CATEGORIAS_GASTO[0], frecuencia: "Mensual", ambito: "Personal" });
  const submitFijo = async (e) => {
    e.preventDefault();
    const monto = parseFloat(fijoForm.monto);
    if (!fijoForm.nombre || !monto) return;
    const id = newId();
    const payload = { id, nombre: fijoForm.nombre, monto, diaPago: parseInt(fijoForm.diaPago, 10) || 1, categoria: fijoForm.categoria, frecuencia: fijoForm.frecuencia, pagadoMes: null, ambito: fijoForm.ambito || "Personal" };
    setShowNewFijo(false);
    setGastosFijos(p => [...p, payload]);
    setFijoForm({ nombre: "", monto: "", diaPago: "1", categoria: CATEGORIAS_GASTO[0], frecuencia: "Mensual", ambito: "Personal" });
    try { await db.insertGastoFijo(userId, payload); }
    catch (err) { offline.pushOp({ type: "upsert", table: "gastos_fijos", payload }); setPendingCount(offline.getQueue().length); }
  };

  const openNewDeuda = () => { setEditingDeudaId(null); setDeudaForm(emptyDeudaForm); setShowDeudaModal(true); };
  const openEditDeuda = (d) => { setEditingDeudaId(d.id); setDeudaForm({ ...d, valorTotal: String(d.valorTotal), valorCuota: String(d.valorCuota), diaPago: String(d.diaPago), cuotasTotales: String(d.cuotasTotales), cuotasPagadas: String(d.cuotasPagadas), tasaInteres: d.tasaInteres != null ? String(d.tasaInteres) : "" }); setShowDeudaModal(true); };
  const submitDeuda = async (e) => {
    e.preventDefault();
    const parsed = {
      entidad: deudaForm.entidad.trim(), tipo: deudaForm.tipo,
      valorTotal: parseFloat(deudaForm.valorTotal) || 0, valorCuota: parseFloat(deudaForm.valorCuota) || 0,
      diaPago: parseInt(deudaForm.diaPago, 10) || 1, cuotasTotales: parseInt(deudaForm.cuotasTotales, 10) || 1,
      cuotasPagadas: parseInt(deudaForm.cuotasPagadas, 10) || 0, fechaInicio: deudaForm.fechaInicio,
      tasaInteres: deudaForm.tasaInteres === "" ? null : parseFloat(deudaForm.tasaInteres), notas: deudaForm.notas, ambito: deudaForm.ambito || "Personal",
    };
    if (!parsed.entidad || !parsed.valorCuota) return;
    setShowDeudaModal(false);
    if (editingDeudaId) {
      setDeudas(p => p.map(d => (d.id === editingDeudaId ? { ...parsed, id: editingDeudaId } : d)));
      try { await db.updateDeuda(editingDeudaId, parsed); }
      catch (err) { offline.pushOp({ type: "update", table: "deudas", rowId: editingDeudaId, payload: parsed }); setPendingCount(offline.getQueue().length); }
    } else {
      const id = newId();
      setDeudas(p => [...p, { ...parsed, id }]);
      try { await db.insertDeuda(userId, { ...parsed, id }); }
      catch (err) { offline.pushOp({ type: "upsert", table: "deudas", payload: { ...parsed, id } }); setPendingCount(offline.getQueue().length); }
    }
  };
  const eliminarDeuda = async (id) => {
    setDeudas(p => p.filter(d => d.id !== id));
    try { await db.deleteDeuda(id); }
    catch (err) { offline.pushOp({ type: "delete", table: "deudas", rowId: id }); setPendingCount(offline.getQueue().length); }
  };
  const marcarCuotaPagada = async (d) => {
    if (d.cuotasPagadas >= d.cuotasTotales) return;
    const nuevo = d.cuotasPagadas + 1;
    const movId = newId();
    setDeudas(p => p.map(x => (x.id === d.id ? { ...x, cuotasPagadas: nuevo } : x)));
    const mov = { id: movId, tipo: "pago_deuda", monto: d.valorCuota, fecha: today.toISOString().slice(0, 10), categoria: "Deudas", cuenta: CUENTAS[0], descripcion: `Cuota ${nuevo}/${d.cuotasTotales} — ${d.entidad}`, fijoVariable: null, ambito: d.ambito || "Personal", reembolsable: false };
    setMovimientos(p => [mov, ...p]);
    try { await db.updateDeudaCuotas(d.id, nuevo); }
    catch (err) { offline.pushOp({ type: "update", table: "deudas", rowId: d.id, payload: { cuotasPagadas: nuevo } }); setPendingCount(offline.getQueue().length); }
    try { await db.insertMovimiento(userId, mov); }
    catch (err) { offline.pushOp({ type: "upsert", table: "movimientos", payload: mov }); setPendingCount(offline.getQueue().length); }
  };
  const deshacerCuota = async (d) => {
    if (d.cuotasPagadas <= 0) return;
    const nuevo = d.cuotasPagadas - 1;
    setDeudas(p => p.map(x => (x.id === d.id ? { ...x, cuotasPagadas: nuevo } : x)));
    try { await db.updateDeudaCuotas(d.id, nuevo); }
    catch (err) { offline.pushOp({ type: "update", table: "deudas", rowId: d.id, payload: { cuotasPagadas: nuevo } }); setPendingCount(offline.getQueue().length); }
  };

  // ---- Metas de ahorro ----
  const submitMeta = async (e) => {
    e.preventDefault();
    const objetivo = parseFloat(metaForm.objetivo);
    const actual = parseFloat(metaForm.actual) || 0;
    if (!metaForm.nombre || !objetivo) return;
    const id = newId();
    const payload = { id, nombre: metaForm.nombre, objetivo, actual, fechaLimite: metaForm.fechaLimite || null, ambito: metaForm.ambito };
    setShowNewMeta(false);
    setMetas(p => [...p, payload]);
    setMetaForm({ nombre: "", objetivo: "", actual: "", fechaLimite: "", ambito: "Personal" });
    try { await db.insertMeta(userId, payload); }
    catch (err) { offline.pushOp({ type: "upsert", table: "metas", payload }); setPendingCount(offline.getQueue().length); }
  };
  const abonarMeta = async (meta) => {
    const v = prompt(`¿Cuánto quieres abonar a "${meta.nombre}"?`, "");
    const monto = parseFloat((v || "").replace(/[^\d]/g, ""));
    if (!monto) return;
    const nuevo = meta.actual + monto;
    setMetas(p => p.map(g => (g.id === meta.id ? { ...g, actual: nuevo } : g)));
    try { await db.updateMeta(meta.id, { actual: nuevo }); }
    catch (err) { offline.pushOp({ type: "update", table: "metas", rowId: meta.id, payload: { actual: nuevo } }); setPendingCount(offline.getQueue().length); }
  };
  const eliminarMeta = async (id) => {
    setMetas(p => p.filter(g => g.id !== id));
    try { await db.deleteMeta(id); }
    catch (err) { offline.pushOp({ type: "delete", table: "metas", rowId: id }); setPendingCount(offline.getQueue().length); }
  };

  // ---- Presupuestos por categoría ----
  const definirPresupuesto = async (categoria) => {
    const existente = presupuestos.find(p => p.categoria === categoria);
    const v = prompt(`Límite mensual para ${categoria} (deja vacío para quitarlo)`, existente ? String(existente.limite) : "");
    if (v === null) return;
    const limite = parseFloat((v || "").replace(/[^\d]/g, ""));
    if (!limite) {
      if (existente) {
        setPresupuestos(p => p.filter(x => x.id !== existente.id));
        try { await db.deletePresupuesto(existente.id); } catch (err) {}
      }
      return;
    }
    const id = existente ? existente.id : newId();
    const payload = { id, categoria, limite };
    setPresupuestos(p => existente ? p.map(x => (x.id === id ? payload : x)) : [...p, payload]);
    try { await db.upsertPresupuesto(userId, payload); }
    catch (err) { offline.pushOp({ type: "upsert", table: "presupuestos", payload }); setPendingCount(offline.getQueue().length); }
  };

  const exportExcel = useCallback(() => {
    const wb = XLSX.utils.book_new();
    const rows = movimientos.slice().sort((a, b) => a.fecha.localeCompare(b.fecha)).map(m => ({
      Fecha: m.fecha, Tipo: m.tipo === "ingreso" ? "Ingreso" : m.tipo === "gasto" ? "Gasto" : m.tipo === "pago_deuda" ? "Pago de deuda" : "Transferencia",
      Concepto: m.descripcion || m.categoria, Categoría: m.categoria, Cuenta: m.cuenta, Valor: m.monto, "Fijo/Variable": m.fijoVariable || "",
      Ámbito: m.ambito || "Personal", Reembolsable: m.reembolsable ? "Sí" : "No",
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    ws["!cols"] = [{ wch: 12 }, { wch: 14 }, { wch: 26 }, { wch: 16 }, { wch: 12 }, { wch: 12 }, { wch: 12 }];
    XLSX.utils.book_append_sheet(wb, ws, "Movimientos");

    const fijosRows = gastosFijos.map(f => ({ Nombre: f.nombre, Monto: f.monto, "Día pago": f.diaPago, Categoría: f.categoria, Estado: estadoFijo(f) }));
    const wsF = XLSX.utils.json_to_sheet(fijosRows);
    wsF["!cols"] = [{ wch: 22 }, { wch: 12 }, { wch: 10 }, { wch: 16 }, { wch: 10 }];
    XLSX.utils.book_append_sheet(wb, wsF, "Gastos fijos");

    const deudaRows = deudas.map(d => ({ Entidad: d.entidad, Tipo: d.tipo, "Valor total": d.valorTotal, "Valor cuota": d.valorCuota, "Cuotas pagadas": d.cuotasPagadas, "Cuotas totales": d.cuotasTotales, "Saldo pendiente": saldoPendienteDeuda(d), Estado: estadoDeuda(d) }));
    const wsD = XLSX.utils.json_to_sheet(deudaRows);
    wsD["!cols"] = [{ wch: 20 }, { wch: 16 }, { wch: 13 }, { wch: 13 }, { wch: 13 }, { wch: 13 }, { wch: 14 }, { wch: 10 }];
    XLSX.utils.book_append_sheet(wb, wsD, "Deudas");

    const resumen = [
      { Indicador: "Saldo en cuentas", Valor: Math.round(saldoActual) },
      { Indicador: "Deuda pendiente total", Valor: Math.round(totalDeudaPendiente) },
      { Indicador: "Patrimonio neto", Valor: Math.round(patrimonioNeto) },
      { Indicador: "Ingresos del mes", Valor: Math.round(ingresosMes) },
      { Indicador: "Gastos del mes", Valor: Math.round(gastosMes) },
    ];
    const wsR = XLSX.utils.json_to_sheet(resumen);
    wsR["!cols"] = [{ wch: 24 }, { wch: 16 }];
    XLSX.utils.book_append_sheet(wb, wsR, "Resumen");

    if (metas.length > 0) {
      const metasRows = metas.map(g => ({ Meta: g.nombre, Ámbito: g.ambito, Objetivo: g.objetivo, Ahorrado: g.actual, Falta: Math.max(0, g.objetivo - g.actual), "Avance %": Math.round((g.actual / g.objetivo) * 100), "Fecha límite": g.fechaLimite || "" }));
      const wsM = XLSX.utils.json_to_sheet(metasRows);
      wsM["!cols"] = [{ wch: 24 }, { wch: 13 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 10 }, { wch: 13 }];
      XLSX.utils.book_append_sheet(wb, wsM, "Metas");
    }

    XLSX.writeFile(wb, `Finanzas_${today.toISOString().slice(0, 10)}.xlsx`);
  }, [movimientos, gastosFijos, deudas, saldoActual, totalDeudaPendiente, patrimonioNeto, ingresosMes, gastosMes]);

  const NAV = [
    { key: "inicio", label: "Inicio", icon: "🏠" },
    { key: "movimientos", label: "Movimientos", icon: "📋" },
    { key: "fijos", label: "Fijos", icon: "🔁" },
    { key: "deudas", label: "Deudas", icon: "🏦" },
    { key: "metas", label: "Metas", icon: "🎯" },
    { key: "calendario", label: "Calendario", icon: "📅" },
    { key: "analisis", label: "Análisis", icon: "📊" },
  ];

  const btnGhost = { display: "inline-flex", alignItems: "center", gap: 4, background: C.bg, border: "none", borderRadius: 10, padding: "7px 10px", fontSize: 11, fontWeight: 600, color: C.muted };

  if (loading) return <div style={{ minHeight: "100vh", background: C.bg, display: "flex", alignItems: "center", justifyContent: "center", color: C.muted }}>Cargando tus datos…</div>;
  if (loadError) return (
    <div style={{ minHeight: "100vh", background: C.bg, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div className="card" style={{ padding: 24, maxWidth: 380, textAlign: "center" }}>
        <div style={{ fontWeight: 700, marginBottom: 8 }}>No se pudo conectar a Supabase</div>
        <div style={{ fontSize: 13, color: C.muted }}>{loadError}</div>
      </div>
    </div>
  );

  function TxRow({ m }) {
    const icon = m.tipo === "pago_deuda" ? "🏦" : CAT_ICON[m.categoria] || (m.tipo === "transferencia" ? "↔️" : "✳️");
    const tone = m.tipo === "ingreso" ? { bg: C.successSoft, col: C.success } : m.tipo === "gasto" ? { bg: C.dangerSoft, col: C.danger } : m.tipo === "pago_deuda" ? { bg: C.warningSoft, col: C.warning } : { bg: C.indigoSoft, col: C.indigo };
    return (
      <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "8px 0" }}>
        <div style={{ width: 38, height: 38, borderRadius: 12, background: tone.bg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, fontSize: 16 }}>{icon}</div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 13, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{m.descripcion || m.categoria}</div>
          <div style={{ fontSize: 11, color: C.faint }}>
            {m.fecha} · {m.cuenta}
            {(m.ambito || "Personal") === "PubliFuturo" && <span style={{ color: C.indigo, fontWeight: 700, marginLeft: 5 }}>· PubliFuturo</span>}
            {m.reembolsable && <span style={{ color: C.warning, fontWeight: 700, marginLeft: 5 }}>· reembolsable</span>}
          </div>
        </div>
        <div className="num" style={{ fontSize: 13, fontWeight: 700, color: tone.col }}>{(m.tipo === "gasto" || m.tipo === "pago_deuda") ? "-" : m.tipo === "ingreso" ? "+" : ""}{fmt(m.monto)}</div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: C.bg, color: C.text }}>
      <div className="app-shell">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "20px 20px 4px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ width: 42, height: 42, borderRadius: 14, background: GRADIENT, display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontWeight: 700, fontSize: 15 }}>{(session.user.email || "U")[0].toUpperCase()}</div>
            <div>
              <div style={{ fontSize: 11.5, color: C.muted }}>{today.getHours() < 12 ? "Buenos días" : today.getHours() < 19 ? "Buenas tardes" : "Buenas noches"}</div>
              <div className="mn" style={{ fontSize: 13.5, fontWeight: 700 }}>{session.user.email}</div>
            </div>
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <button onClick={() => setShowNotifs(s => !s)} title="Notificaciones" style={{ position: "relative", width: 38, height: 38, borderRadius: 12, background: C.card, border: `1px solid ${C.border}`, display: "flex", alignItems: "center", justifyContent: "center", color: C.muted }}>
              🔔
              {notificaciones.length > 0 && (
                <span style={{ position: "absolute", top: -5, right: -5, minWidth: 18, height: 18, borderRadius: 99, background: C.danger, color: "#fff", fontSize: 10, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 4px" }}>{notificaciones.length}</span>
              )}
            </button>
            <button onClick={onLogout} title="Cerrar sesión" style={{ width: 38, height: 38, borderRadius: 12, background: C.card, border: `1px solid ${C.border}`, display: "flex", alignItems: "center", justifyContent: "center", color: C.muted }}>⏻</button>
          </div>
        </div>

        {showNotifs && (
          <div style={{ margin: "10px 20px 0" }}>
            <div className="card" style={{ padding: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div className="mn" style={{ fontWeight: 700, fontSize: 13 }}>Notificaciones</div>
                <button onClick={() => setShowNotifs(false)} style={{ background: "none", border: "none", color: C.faint }}>✕</button>
              </div>
              {notificaciones.length === 0 ? (
                <div style={{ fontSize: 12.5, color: C.faint, padding: "8px 0" }}>Todo al día, sin alertas pendientes.</div>
              ) : notificaciones.map(n => {
                const col = n.tipo === "vencido" ? C.danger : n.tipo === "presupuesto" ? C.warning : C.indigo;
                const soft = n.tipo === "vencido" ? C.dangerSoft : n.tipo === "presupuesto" ? C.warningSoft : C.indigoSoft;
                return (
                  <div key={n.id} style={{ display: "flex", alignItems: "center", gap: 10, borderTop: `1px solid ${C.border}`, padding: "9px 2px" }}>
                    <div style={{ width: 8, height: 8, borderRadius: 99, background: col, flexShrink: 0 }} />
                    <div style={{ flex: 1, fontSize: 12.5 }}>{n.texto}</div>
                    <span className="num" style={{ fontSize: 12, fontWeight: 700, color: col, background: soft, padding: "2px 7px", borderRadius: 8 }}>{fmt(n.monto)}</span>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        <div style={{ margin: "12px 20px 0", display: "flex", gap: 4, background: C.card, borderRadius: 12, padding: 4, border: `1px solid ${C.border}` }}>
          {["Todos", ...AMBITOS].map(a => (
            <button key={a} onClick={() => setFiltroAmbito(a)} style={{ flex: 1, padding: "8px 0", borderRadius: 9, border: "none", fontSize: 12, fontWeight: 700, background: filtroAmbito === a ? C.indigo : "transparent", color: filtroAmbito === a ? "#fff" : C.muted }}>{a}</button>
          ))}
        </div>

        {(pendingCount > 0 || usingCache) && (
          <div style={{ margin: "10px 20px 0", background: usingCache ? C.warningSoft : C.dangerSoft, border: `1px solid ${usingCache ? C.warning : C.danger}44`, borderRadius: 12, padding: "10px 12px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, fontSize: 12 }}>
            <span style={{ color: usingCache ? "#8a5a10" : "#8a2020" }}>{usingCache ? "Sin conexión — mostrando la última copia guardada." : `${pendingCount} cambio${pendingCount === 1 ? "" : "s"} sin sincronizar.`}</span>
            {pendingCount > 0 && <button onClick={retrySync} disabled={syncing} style={{ background: "none", border: "none", fontWeight: 700, color: C.indigo, fontSize: 12, flexShrink: 0 }}>{syncing ? "Sincronizando..." : "Reintentar"}</button>}
          </div>
        )}

        <div className="content-pad">
          {view === "inicio" && (
            <div className="desktop-2col">
            <div style={{ display: "grid", gap: 16 }}>
              <div style={{ background: GRADIENT, borderRadius: 22, padding: 20, color: "#fff", position: "relative", overflow: "hidden" }}>
                <div style={{ fontSize: 12, opacity: 0.85, marginBottom: 4 }}>Saldo disponible</div>
                <div className="mn num" style={{ fontSize: 30, fontWeight: 800, marginBottom: 16 }}>{fmt(saldoActual)}</div>
                <div style={{ display: "flex", gap: 10 }}>
                  <button onClick={() => openNew("ingreso")} className="press" style={{ flex: 1, background: "rgba(255,255,255,0.16)", border: "1px solid rgba(255,255,255,0.25)", borderRadius: 12, padding: "10px 0", color: "#fff", fontSize: 12.5, fontWeight: 600 }}>↓ Ingreso</button>
                  <button onClick={() => openNew("gasto")} className="press" style={{ flex: 1, background: "rgba(255,255,255,0.16)", border: "1px solid rgba(255,255,255,0.25)", borderRadius: 12, padding: "10px 0", color: "#fff", fontSize: 12.5, fontWeight: 600 }}>↑ Gasto</button>
                  <button onClick={exportExcel} className="press" style={{ width: 42, background: "rgba(255,255,255,0.16)", border: "1px solid rgba(255,255,255,0.25)", borderRadius: 12, color: "#fff" }}>⬇</button>
                </div>
              </div>

              <div className="stats-grid">
                <div className="card" style={{ padding: 14 }}><div style={{ fontSize: 11, color: C.muted, marginBottom: 4 }}>Ingresos del mes</div><div className="mn num" style={{ fontSize: 16, fontWeight: 700, color: C.success }}>{fmt(ingresosMes)}</div></div>
                <div className="card" style={{ padding: 14 }}><div style={{ fontSize: 11, color: C.muted, marginBottom: 4 }}>Gastos del mes</div><div className="mn num" style={{ fontSize: 16, fontWeight: 700, color: C.danger }}>{fmt(gastosMes)}</div></div>
                <div className="card" style={{ padding: 14 }}><div style={{ fontSize: 11, color: C.muted, marginBottom: 4 }}>Disponible</div><div className="mn num" style={{ fontSize: 16, fontWeight: 700, color: disponible >= 0 ? C.success : C.danger }}>{fmt(disponible)}</div></div>
                <div className="card" style={{ padding: 14 }}><div style={{ fontSize: 11, color: C.muted, marginBottom: 4 }}>Próximo pago</div><div className="mn num" style={{ fontSize: 16, fontWeight: 700 }}>{proximoPago ? fmt(proximoPago.monto) : "—"}</div>{proximoPago && <div style={{ fontSize: 10, color: C.faint, marginTop: 2 }}>{proximoPago.nombre} · día {proximoPago.diaPago}</div>}</div>
                {totalReembolsable > 0 && <div className="card" style={{ padding: 14 }}><div style={{ fontSize: 11, color: C.muted, marginBottom: 4 }}>Por reembolsar</div><div className="mn num" style={{ fontSize: 16, fontWeight: 700, color: C.warning }}>{fmt(totalReembolsable)}</div><div style={{ fontSize: 10, color: C.faint, marginTop: 2 }}>gastos que te devuelven</div></div>}
              </div>

              <div style={{ background: "#181830", borderRadius: 22, padding: "18px 16px" }}>
                <div className="mn" style={{ color: "#fff", fontWeight: 700, fontSize: 14, marginBottom: 6 }}>Ingresos vs. gastos</div>
                <MiniBarChart data={dataMensual} dark />
              </div>
            </div>

            <div style={{ display: "grid", gap: 16 }}>
              <div className="card" style={{ padding: 16 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                  <div className="mn" style={{ fontWeight: 700, fontSize: 14 }}>¿En qué estoy gastando?</div>
                  <span style={{ fontSize: 10, color: C.faint }}>toca una categoría para poner límite</span>
                </div>
                <div style={{ display: "grid", gap: 12 }}>
                  {categoriasMes.map(c => {
                    const pres = presupuestos.find(p => p.categoria === c.name);
                    const pctPres = pres ? Math.round((c.value / pres.limite) * 100) : null;
                    const excedido = pres && c.value > pres.limite;
                    return (
                      <button key={c.name} onClick={() => definirPresupuesto(c.name)} style={{ display: "flex", alignItems: "center", gap: 10, background: "none", border: "none", padding: 0, width: "100%", textAlign: "left" }}>
                        <div style={{ width: 34, height: 34, borderRadius: 10, background: excedido ? C.dangerSoft : C.indigoSoft, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, fontSize: 15 }}>{CAT_ICON[c.name] || "✳️"}</div>
                        <div style={{ flex: 1 }}>
                          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 3 }}>
                            <span>{c.name}{excedido && <span style={{ color: C.danger, fontWeight: 700, marginLeft: 5 }}>⚠ excedido</span>}</span>
                            <span className="num" style={{ fontWeight: 700, color: excedido ? C.danger : C.text }}>{fmt(c.value)}</span>
                          </div>
                          <div style={{ height: 5, background: C.border, borderRadius: 4, overflow: "hidden" }}>
                            <div style={{ height: "100%", width: `${pres ? Math.min(100, pctPres) : c.pct}%`, background: excedido ? C.danger : GRADIENT, borderRadius: 4 }} />
                          </div>
                          {pres && <div style={{ fontSize: 9.5, color: excedido ? C.danger : C.faint, marginTop: 3 }}>Límite {fmt(pres.limite)} · {pctPres}% usado</div>}
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="card" style={{ padding: 16 }}>
                <div className="mn" style={{ fontWeight: 700, fontSize: 14, marginBottom: 10 }}>Movimientos recientes</div>
                <div style={{ display: "grid", gap: 4 }}>{recientes.map(m => <TxRow key={m.id} m={m} />)}</div>
              </div>
            </div>
            </div>
          )}

          {view === "movimientos" && (
            <div style={{ display: "grid", gap: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div className="mn" style={{ fontWeight: 800, fontSize: 19 }}>Movimientos</div>
                <button onClick={() => openNew()} className="press" style={{ display: "flex", alignItems: "center", gap: 5, background: C.indigo, color: "#fff", border: "none", borderRadius: 10, padding: "8px 12px", fontSize: 12, fontWeight: 600 }}>+ Nuevo</button>
              </div>
              <div className="card" style={{ padding: "10px 12px", display: "flex", alignItems: "center", gap: 8 }}>
                🔍 <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Buscar movimiento..." style={{ border: "none", outline: "none", fontSize: 13, flex: 1, background: "transparent" }} />
              </div>
              <div style={{ display: "flex", gap: 8, overflowX: "auto" }}>
                <select value={filterTipo} onChange={e => setFilterTipo(e.target.value)} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: "8px 10px", fontSize: 12 }}>
                  <option value="Todos">Todos</option><option value="ingreso">Ingresos</option><option value="gasto">Gastos</option><option value="pago_deuda">Pagos de deuda</option><option value="transferencia">Transferencias</option>
                </select>
                <select value={filterCat} onChange={e => setFilterCat(e.target.value)} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: "8px 10px", fontSize: 12 }}>
                  <option value="Todas">Categoría</option>
                  {[...CATEGORIAS_GASTO, ...CATEGORIAS_INGRESO].map(c => <option key={c} value={c}>{c}</option>)}
                </select>
                <select value={filterMes} onChange={e => setFilterMes(e.target.value)} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: "8px 10px", fontSize: 12 }}>
                  <option value="Todos">Mes</option>
                  {mesesDisponibles.map(m => <option key={m} value={m}>{MESES[parseInt(m.slice(5, 7), 10) - 1]} {m.slice(0, 4)}</option>)}
                </select>
              </div>
              <div className="card" style={{ padding: 14 }}>
                {filtered.length === 0 ? <div style={{ textAlign: "center", color: C.faint, fontSize: 13, padding: "24px 0" }}>Sin resultados.</div> : (
                  <div>{filtered.map(m => (
                    <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <div style={{ flex: 1 }}><TxRow m={m} /></div>
                      <div style={{ display: "flex", gap: 4 }}>
                        <button onClick={() => openEdit(m)} style={{ background: "none", border: "none", color: C.faint, padding: 4 }}>✏️</button>
                        <button onClick={() => deleteMov(m.id)} style={{ background: "none", border: "none", color: C.faint, padding: 4 }}>🗑️</button>
                      </div>
                    </div>
                  ))}</div>
                )}
              </div>
            </div>
          )}

          {view === "fijos" && (

                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>

                    <MoneyInput value={metaForm.actual} onChange={v => setMetaForm(f => ({ ...f, actual: v }))} placeholder="Ya tengo — Ej: 500.000" style={{ width: "100%", background: C.bg, border: "none", borderRadius: 10, padding: "9px 10px", fontSize: 13 }} />

                  <div style={{ display: "flex", gap: 6, background: C.bg, borderRadius: 12, padding: 4 }}>

              {metasAmbito.length === 0 ? (

                <div style={{ display: "grid", gap: 10 }}>
                  {metasAmbito.map(g => {
                    const pct = Math.min(100, Math.round((g.actual / g.objetivo) * 100));
                    const falta = Math.max(0, g.objetivo - g.actual);
                    const lograda = g.actual >= g.objetivo;
                    return (
                      <div key={g.id} className="card" style={{ padding: 16 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                            <div style={{ width: 40, height: 40, borderRadius: 12, background: lograda ? C.successSoft : C.indigoSoft, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 17 }}>{lograda ? "🏆" : "🎯"}</div>
                            <div>
                              <div style={{ fontSize: 14, fontWeight: 700 }}>{g.nombre}</div>
                              <div style={{ fontSize: 11, color: C.faint }}>{g.ambito}{g.fechaLimite ? ` · hasta ${g.fechaLimite}` : ""}</div>

          {view === "calendario" && (
            <div style={{ display: "grid", gap: 14 }}>
              <div className="mn" style={{ fontWeight: 800, fontSize: 19 }}>Calendario</div>
              {(() => {
                const base = new Date(today.getFullYear(), today.getMonth() + calOffset, 1);
                const y = base.getFullYear(), m = base.getMonth();
                const nDays = new Date(y, m + 1, 0).getDate();
                const firstWeekday = new Date(y, m, 1).getDay();
                const isCurrentMonth = calOffset === 0;

                const eventColor = (ev) => ev.kind === "fijo" ? estadoColor[ev.estado] : (ev.estado === "Al día" ? C.success : ev.estado === "Atrasada" ? C.danger : C.faint);
                const eventSoft = (ev) => ev.kind === "fijo" ? estadoSoft[ev.estado] : (ev.estado === "Al día" ? C.successSoft : ev.estado === "Atrasada" ? C.dangerSoft : C.border);

                // ¿Aplica este gasto fijo en el mes que se está viendo?
                const fijoAplicaEnMes = (f) => {
                  const frec = f.frecuencia || "Mensual";
                  if (frec === "Único") {
                    // Solo en el mes en que se registró/paga; si ya se pagó, en el mes del pago.
                    if (f.pagadoMes) { const [py, pm] = f.pagadoMes.split("-").map(Number); return y === py && m === pm - 1; }
                    return calOffset === 0; // pendiente: se muestra en el mes actual
                  }
                  if (frec === "Anual") return m === today.getMonth();
                  return true; // Mensual, Quincenal, Semanal → todos los meses
                };

                // Estado del evento para el mes que se está viendo (meses futuros = "Próximo")
                const estadoFijoEnMes = (f) => {
                  if (calOffset < 0) return f.pagadoMes ? "Pagado" : "Vencido"; // meses pasados
                  if (calOffset > 0) return "Próximo";                            // meses futuros
                  return estadoFijo(f);                                            // mes actual
                };
                const estadoDeudaEnMes = (d) => {
                  if (calOffset > 0) return "Al día";
                  return estadoDeuda(d);
                };

                // ¿Cuántas cuotas de esta deuda quedan y aplica en el mes visto?
                const deudaAplicaEnMes = (d) => {
                  const [y0, m0] = d.fechaInicio.slice(0, 7).split("-").map(Number);
                  const offsetDesdeInicio = (y - y0) * 12 + (m - (m0 - 1));
                  return offsetDesdeInicio >= 0 && offsetDesdeInicio < d.cuotasTotales;
                };

                const eventosPorDia = {};
                fijosAmbito.forEach(f => {
                  if (!fijoAplicaEnMes(f)) return;
                  const diasDelMes = [f.diaPago];
                  const frec = f.frecuencia || "Mensual";
                  if (frec === "Quincenal") { const d2 = f.diaPago + 15; if (d2 <= nDays) diasDelMes.push(d2); }
                  if (frec === "Semanal") { for (let d2 = f.diaPago + 7; d2 <= nDays; d2 += 7) diasDelMes.push(d2); }
                  diasDelMes.forEach((dia, idx) => {
                    const ev = { kind: "fijo", id: "f-" + f.id + "-" + idx, nombre: f.nombre, monto: f.monto, diaPago: dia, icon: CAT_ICON[f.categoria] || "✳️", estado: estadoFijoEnMes(f), data: f };
                    (eventosPorDia[dia] = eventosPorDia[dia] || []).push(ev);
                  });
                });
                deudasAmbito.forEach(d => {
                  if (estadoDeuda(d) === "Pagada") return;
                  if (!deudaAplicaEnMes(d)) return;
                  const ev = { kind: "deuda", id: "d-" + d.id, nombre: d.entidad, monto: d.valorCuota, diaPago: d.diaPago, icon: "🏦", estado: estadoDeudaEnMes(d), data: d };
                  (eventosPorDia[d.diaPago] = eventosPorDia[d.diaPago] || []).push(ev);
                });

                const cells = [];
                for (let i = 0; i < firstWeekday; i++) cells.push(null);
                for (let d = 1; d <= nDays; d++) cells.push(d);
                const todosEventos = Object.values(eventosPorDia).flat();
                const pagadosMes = todosEventos.filter(ev => ev.estado === "Pagado").length;
                const pendientesMes = todosEventos.filter(ev => ev.estado === "Próximo" || ev.estado === "Vencido").length;
                const deudasActivasMes = todosEventos.filter(ev => ev.kind === "deuda").length;
                const comprometidoMes = todosEventos.reduce((a, ev) => a + ev.monto, 0);
                return (
                  <React.Fragment>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <button onClick={() => { setCalOffset(o => o - 1); setSelectedDay(null); setSelectedFijo(null); }} className="press" style={{ ...btnGhost, padding: 8 }}>◀</button>
                        <div className="mn" style={{ fontWeight: 700, fontSize: 14, textTransform: "capitalize" }}>{MESES[m]} {y}</div>
                        <button onClick={() => { setCalOffset(o => o + 1); setSelectedDay(null); setSelectedFijo(null); }} className="press" style={{ ...btnGhost, padding: 8 }}>▶</button>
                      </div>
                      <div style={{ display: "flex", gap: 3, background: C.card, borderRadius: 10, padding: 3, border: `1px solid ${C.border}` }}>
                        {["calendario", "lista"].map(mo => <button key={mo} onClick={() => setCalMode(mo)} style={{ padding: "5px 10px", borderRadius: 7, border: "none", fontSize: 11, fontWeight: 600, background: calMode === mo ? C.indigo : "transparent", color: calMode === mo ? "#fff" : C.muted, textTransform: "capitalize" }}>{mo}</button>)}
                      </div>
                    </div>

                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 8 }}>
                      <div className="card" style={{ padding: 10, textAlign: "center" }}>
                        <div className="num" style={{ fontSize: 15, fontWeight: 800, color: C.success }}>{pagadosMes}</div>
                        <div style={{ fontSize: 9.5, color: C.faint }}>Pagados</div>
                      </div>
                      <div className="card" style={{ padding: 10, textAlign: "center" }}>
                        <div className="num" style={{ fontSize: 15, fontWeight: 800, color: C.warning }}>{pendientesMes}</div>
                        <div style={{ fontSize: 9.5, color: C.faint }}>Pendientes</div>
                      </div>
                      <div className="card" style={{ padding: 10, textAlign: "center" }}>
                        <div className="num" style={{ fontSize: 15, fontWeight: 800, color: C.indigo }}>{deudasActivasMes}</div>
                        <div style={{ fontSize: 9.5, color: C.faint }}>Deudas activas</div>
                      </div>
                      <div className="card" style={{ padding: 10, textAlign: "center" }}>
                        <div className="num" style={{ fontSize: 15, fontWeight: 800 }}>{fmt(comprometidoMes)}</div>
                        <div style={{ fontSize: 9.5, color: C.faint }}>Comprometido</div>
                      </div>
                    </div>

                    {calMode === "calendario" ? (
                      <div className="card" style={{ padding: 14 }}>
                        <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4, marginBottom: 6 }}>
                          {DIAS_CORTOS.map(d => <div key={d} style={{ textAlign: "center", fontSize: 9.5, color: C.faint, fontWeight: 700, textTransform: "uppercase" }}>{d[0]}</div>)}
                        </div>
                        <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4 }}>
                          {cells.map((d, i) => {
                            const eventos = d ? eventosPorDia[d] || [] : [];
                            const isToday = isCurrentMonth && d === today.getDate();
                            const isSelected = selectedDay === d;
                            const hasEventos = eventos.length > 0;
                            return (
                              <button
                                key={i}
                                onClick={() => { if (hasEventos) { setSelectedDay(d === selectedDay ? null : d); setSelectedFijo(null); } }}
                                style={{ minHeight: 54, borderRadius: 10, padding: 4, background: isSelected ? C.indigo : isToday ? C.indigoSoft : "transparent", border: "none", textAlign: "left", cursor: hasEventos ? "pointer" : "default" }}
                              >
                                {d && <div className="num" style={{ fontSize: 10.5, color: isSelected ? "#fff" : isToday ? C.indigo : C.faint, fontWeight: isToday || isSelected ? 800 : 500, marginBottom: 2 }}>{d}</div>}
                                {hasEventos && (
                                  <div style={{ display: "flex", gap: 2, flexWrap: "wrap" }}>
                                    {eventos.slice(0, 4).map(ev => (
                                      <span key={ev.id} style={{ width: 6, height: 6, borderRadius: 99, background: isSelected ? "#fff" : eventColor(ev), display: "inline-block" }} />
                                    ))}
                                  </div>
                                )}
                              </button>
                            );
                          })}
                        </div>
                        <div style={{ display: "flex", gap: 12, marginTop: 12, fontSize: 10, color: C.muted, flexWrap: "wrap" }}>
                          <span><span style={{ display: "inline-block", width: 7, height: 7, borderRadius: 99, background: C.warning, marginRight: 4 }} />Próximo</span>

                            <div style={{ width: 34, height: 34, borderRadius: 10, background: eventSoft(ev), display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14 }}>{ev.icon}</div>
                            <div style={{ flex: 1 }}>
                              <div style={{ fontSize: 12.5, fontWeight: 600 }}>{ev.nombre}{ev.kind === "deuda" && <span style={{ fontSize: 9.5, color: C.indigo, marginLeft: 5 }}>· deuda</span>}</div>
                              <div style={{ fontSize: 10.5, color: C.faint }}>día {ev.diaPago} · {ev.estado}</div>
                            </div>
                            <span className="num" style={{ fontWeight: 700, fontSize: 12.5 }}>{fmt(ev.monto)}</span>
                          </button>
                        ))}
                      </div>
                    )}

                    {selectedDay && (
                      <div className="card" style={{ padding: 14 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                          <div className="mn" style={{ fontWeight: 700, fontSize: 13 }}>Día {selectedDay} de {MESES[m]}</div>
                          <button onClick={() => setSelectedDay(null)} style={{ background: "none", border: "none", color: C.faint }}>✕</button>
                        </div>
                        {(eventosPorDia[selectedDay] || []).map(ev => (
                          <button key={ev.id} onClick={() => { setSelectedFijo(ev); }} style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", background: "none", border: "none", borderTop: `1px solid ${C.border}`, padding: "10px 4px", textAlign: "left" }}>
                            <div style={{ width: 32, height: 32, borderRadius: 10, background: eventSoft(ev), display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, flexShrink: 0 }}>{ev.icon}</div>
                            <div style={{ flex: 1, minWidth: 0 }}>
                              <div style={{ fontSize: 12.5, fontWeight: 600 }}>{ev.nombre}{ev.kind === "deuda" && <span style={{ fontSize: 9.5, color: C.indigo, marginLeft: 5 }}>· deuda</span>}</div>
                              <div style={{ fontSize: 10, color: C.faint }}>{ev.estado} · toca para ver detalle</div>
                            </div>
                            <span className="num" style={{ fontWeight: 700, fontSize: 12.5 }}>{fmt(ev.monto)}</span>
                          </button>

                  </React.Fragment>

              {selectedFijo && selectedFijo.kind === "deuda" && (
                <div className="card" style={{ padding: 16, border: `1px solid ${C.indigo}33` }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div className="mn" style={{ fontWeight: 700, fontSize: 14 }}>🏦 {selectedFijo.data.entidad}</div>
                    <button onClick={() => setSelectedFijo(null)} style={{ background: "none", border: "none", color: C.faint }}>✕</button>
                  </div>
                  <div className="num" style={{ fontSize: 20, fontWeight: 800, margin: "6px 0" }}>{fmt(selectedFijo.data.valorCuota)}</div>
                  <div style={{ fontSize: 11.5, color: C.muted, marginBottom: 10 }}>{selectedFijo.data.tipo} · cuota {selectedFijo.data.cuotasPagadas}/{selectedFijo.data.cuotasTotales} · día {selectedFijo.data.diaPago} · {estadoDeuda(selectedFijo.data)}</div>

              )}

          {view === "analisis" && (() => {
            const flujoRows = [{ label: "Ingresos", value: ingresosMes }, { label: "Gastos fijos", value: -totalGastosFijos }, { label: "Gastos variables", value: -gastosVariablesMes }];
            const ingresosPorCat = (() => {
              const map = {};
              movsAmbito.filter(m => m.tipo === "ingreso" && m.fecha.slice(0, 7) === mesActual).forEach(m => { map[m.categoria] = (map[m.categoria] || 0) + m.monto; });
              return Object.entries(map).sort((a, b) => b[1] - a[1]).map(([name, value]) => ({ name, value }));

            const topCat = categoriasMes[0];
            return (
              <div style={{ display: "grid", gap: 14 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>

                  <button onClick={exportExcel} className="press" style={{ display: "flex", alignItems: "center", gap: 5, background: C.indigo, color: "#fff", border: "none", borderRadius: 10, padding: "8px 12px", fontSize: 12, fontWeight: 600 }}>⬇ Exportar informe</button>

                    {topCat && ` La categoría con más peso fue ${topCat.name} (${fmt(topCat.value)}).`}
                    {totalDeudaPendiente > 0 && ` La deuda pendiente consolidada es de ${fmt(totalDeudaPendiente)}, dejando un patrimonio neto de ${fmt(patrimonioNeto)}.`}
                  </div>
                </div>

                <div className="card" style={{ padding: 18 }}>
                  <div className="mn" style={{ fontWeight: 700, fontSize: 14, marginBottom: 12 }}>Tendencia — últimos {dataMensual.length} meses</div>

                      <thead>
                        <tr style={{ borderBottom: `1px solid ${C.border}` }}>

                          <th style={{ textAlign: "right", padding: "6px 4px", color: C.faint, fontWeight: 600 }}>Ingresos</th>
                          <th style={{ textAlign: "right", padding: "6px 4px", color: C.faint, fontWeight: 600 }}>Gastos</th>
                          <th style={{ textAlign: "right", padding: "6px 4px", color: C.faint, fontWeight: 600 }}>Neto</th>
                        </tr>

                          <tr key={d.key} style={{ borderBottom: `1px solid ${C.border}` }}>

                            <td className="num" style={{ padding: "6px 4px", textAlign: "right", color: C.success }}>{fmt(d.ingreso)}</td>
                            <td className="num" style={{ padding: "6px 4px", textAlign: "right", color: C.danger }}>{fmt(d.gasto)}</td>
                            <td className="num" style={{ padding: "6px 4px", textAlign: "right", fontWeight: 700, color: d.ingreso - d.gasto >= 0 ? C.success : C.danger }}>{fmt(d.ingreso - d.gasto)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div style={{ background: GRADIENT, borderRadius: 20, padding: 18, color: "#fff" }}>

                  </div>

              <div style={{ display: "grid", gap: 12 }}>
                <div style={{ display: "flex", gap: 6, background: C.bg, borderRadius: 12, padding: 4 }}>
                  {[["ingreso", "Ingreso"], ["gasto", "Gasto"], ["transferencia", "Transfer."]].map(([t, l]) => (
                    <button type="button" key={t} onClick={() => setForm(f => ({ ...f, tipo: t, categoria: t === "ingreso" ? CATEGORIAS_INGRESO[0] : CATEGORIAS_GASTO[0] }))} style={{ flex: 1, padding: "8px 0", borderRadius: 9, fontSize: 12, fontWeight: 700, border: "none", background: form.tipo === t ? C.card : "transparent", color: form.tipo === t ? C.indigo : C.muted, boxShadow: form.tipo === t ? "0 1px 4px rgba(20,20,43,0.1)" : "none" }}>{l}</button>

                </div>

                </div>

                  <div>
                    <div style={labelStyle}>Tipo de gasto</div>

                      <span style={{ width: 18, height: 18, borderRadius: 6, border: `2px solid ${form.reembolsable ? C.success : C.faint}`, background: form.reembolsable ? C.success : "transparent", color: "#fff", fontSize: 12, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{form.reembolsable ? "✓" : ""}</span>
                      Es reembolsable (me lo van a devolver)
                    </button>
                  </div>
                )}
                <label style={labelStyle}>Descripción (opcional)<input value={form.descripcion} onChange={e => setForm(f => ({ ...f, descripcion: e.target.value }))} style={inputStyle} placeholder="Ej: Cliente Mateo Herrera Seguros" /></label>

              </div>
            </form>
          </div>

      })()}

      {showDeudaModal && (() => {
        const inputStyle = { width: "100%", background: C.bg, border: "none", borderRadius: 12, padding: "11px 12px", fontSize: 13.5, marginTop: 5 };

        const set = k => e => setDeudaForm(f => ({ ...f, [k]: e.target.value }));
        return (
          <div style={{ position: "fixed", inset: 0, background: "rgba(20,20,43,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50 }}>
            <form onSubmit={submitDeuda} style={{ background: C.card, borderRadius: "24px 24px 0 0", padding: "22px 20px 28px", width: "100%", maxWidth: 460, maxHeight: "88vh", overflowY: "auto" }}>
              <div style={{ width: 40, height: 4, borderRadius: 4, background: C.border, margin: "0 auto 16px" }} />
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
                <div className="mn" style={{ fontWeight: 800, fontSize: 16 }}>{editingDeudaId ? "Editar" : "Nueva"} deuda</div>
                <button type="button" onClick={() => setShowDeudaModal(false)} style={{ background: C.bg, border: "none", borderRadius: 10, width: 30, height: 30, color: C.muted }}>✕</button>
              </div>
              <div style={{ display: "grid", gap: 12 }}>

                  <label style={labelStyle}>Valor cuota<MoneyInput value={deudaForm.valorCuota} onChange={v => setDeudaForm(f => ({ ...f, valorCuota: v }))} placeholder="Ej: 570.000" style={inputStyle} /></label>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
                  <label style={labelStyle}>Día de pago<input required type="number" min="1" max="31" value={deudaForm.diaPago} onChange={set("diaPago")} style={inputStyle} placeholder="Ej: 15" /></label>
                  <label style={labelStyle}>Total de cuotas<input required type="number" min="1" value={deudaForm.cuotasTotales} onChange={set("cuotasTotales")} style={inputStyle} placeholder="Ej: 12" /></label>
                  <label style={labelStyle}>Cuotas ya pagadas<input required type="number" min="0" value={deudaForm.cuotasPagadas} onChange={set("cuotasPagadas")} style={inputStyle} placeholder="Ej: 0" /></label>
                </div>
                <label style={labelStyle}>Fecha de inicio del crédito<input required type="date" value={deudaForm.fechaInicio} onChange={set("fechaInicio")} style={inputStyle} /></label>

                <label style={labelStyle}>Notas (opcional)<input value={deudaForm.notas} onChange={set("notas")} style={inputStyle} /></label>

                  <div style={labelStyle}>¿A qué corresponde?</div>
                  <div style={{ display: "flex", gap: 6, marginTop: 5, background: C.bg, borderRadius: 12, padding: 4 }}>
                    {AMBITOS.map(a => <button type="button" key={a} onClick={() => setDeudaForm(f => ({ ...f, ambito: a }))} style={{ flex: 1, padding: "7px 0", borderRadius: 9, fontSize: 12, fontWeight: 700, border: "none", background: deudaForm.ambito === a ? C.card : "transparent", color: deudaForm.ambito === a ? C.indigo : C.muted, boxShadow: deudaForm.ambito === a ? "0 1px 4px rgba(20,20,43,0.1)" : "none" }}>{a}</button>)}
                  </div>
                </div>
                <button type="submit" style={{ background: GRADIENT, color: "#fff", border: "none", borderRadius: 14, padding: "13px 0", fontWeight: 700, fontSize: 13.5, marginTop: 6 }}>{editingDeudaId ? "Guardar cambios" : "Registrar deuda"}</button>
              </div>
            </form>
          </div>
        );
      })()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
